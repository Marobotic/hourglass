name: Hourglass
options:
  bundleIdPrefix: dev.marobotic
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.2.2"
    CURRENT_PROJECT_VERSION: "4"
targets:
  Hourglass:
    type: application
    platform: iOS
    sources:
      - Hourglass/Sources
      - Hourglass/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.marobotic.hourglass
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Hourglass/Info.plist
      properties:
        CFBundleDisplayName: Hourglass
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # The sync server. Builds never carry an account token: everyone signs in.
        HourglassServer: https://marobotic.dev/hourglass
        NSAlarmKitUsageDescription: Hourglass rings before your lectures and when timers finish.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # Resource groups are flattened into the bundle root.
        UIAppFonts:
          - JetBrainsMono-Regular.ttf
          - JetBrainsMono-Bold.ttf
