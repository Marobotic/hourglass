name: Hourglass
options:
  bundleIdPrefix: dev.marobotic
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.2.8"
    CURRENT_PROJECT_VERSION: "12"
targets:
  Hourglass:
    type: application
    platform: iOS
    sources:
      - Hourglass/Sources
      - Hourglass/Resources
    dependencies:
      - target: HourglassShare
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.marobotic.hourglass
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Hourglass/Info.plist
      properties:
        CFBundleDisplayName: Hourglass
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # The sync server. Builds never carry an account token: everyone signs in.
        HourglassServer: https://marobotic.dev/hourglass
        NSAlarmKitUsageDescription: Hourglass rings before your lectures and when timers finish.
        # Background refresh: iOS wakes the app now and then to sync, so alarms
        # set on another device get scheduled here without opening Hourglass.
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - dev.marobotic.hourglass.sync
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # Resource groups are flattened into the bundle root.
        UIAppFonts:
          - JetBrainsMono-Regular.ttf
          - JetBrainsMono-Bold.ttf
          - Inter-Regular.ttf
          - Inter-Bold.ttf
          - Lora-Regular.ttf
          - Lora-Bold.ttf
          - Caveat-Regular.ttf
          - Caveat-Bold.ttf
          - PlayfairDisplay-Regular.ttf
          - PlayfairDisplay-Bold.ttf
          - NoteJetBrainsMono-Regular.ttf
          - NoteJetBrainsMono-Bold.ttf

  # "Share to Hourglass": files, photos and videos to the Drive, text and links to Notes.
  HourglassShare:
    type: app-extension
    platform: iOS
    sources:
      - Share
      - path: Hourglass/Sources/SharedBox.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.marobotic.hourglass.share
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Share/Info.plist
      properties:
        CFBundleDisplayName: Hourglass
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsFileWithMaxCount: 20
              NSExtensionActivationSupportsImageWithMaxCount: 20
              NSExtensionActivationSupportsMovieWithMaxCount: 20
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
