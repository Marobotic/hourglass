name: iOS

on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-15
    permissions:
      contents: write
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      # Unsigned: signing happens on Linux with a free Apple ID (see maro-ios).
      - name: Build
        run: |
          xcodebuild \
            -project Hourglass.xcodeproj \
            -scheme Hourglass \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || { grep -E "error:" build.log | sort -u; exit 1; }
          grep -E "Sources/.*warning:" build.log | sort -u || true

      - name: Package ipa
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Hourglass.app Payload/
          zip -qr Hourglass.ipa Payload

      # The ipa goes on the latest-build release (prerelease) of this repo:
      # release assets do not count against the account's Actions storage,
      # which ran out and failed good builds at the upload.
      # `mdeploy ios update Marobotic/hourglass --tag latest-build` installs it;
      # tools/release.ps1 takes it from there too.
      - name: Publish to the latest-build release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest-build >/dev/null 2>&1 ||             gh release create latest-build --prerelease --title "Latest build"               --notes "The newest builds from main, replaced on every push."
          gh release upload latest-build Hourglass.ipa --clobber

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Hourglass-ipa
          path: ios/Hourglass.ipa
          retention-days: 3

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: ios/build.log
          retention-days: 14
