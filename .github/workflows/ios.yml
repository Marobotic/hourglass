name: iOS

on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"

      - name: Generate project
        env:
          HOURGLASS_SERVER: ${{ secrets.HOURGLASS_SERVER }}
          HOURGLASS_TOKEN: ${{ secrets.HOURGLASS_TOKEN }}
        run: |
          # Ship the token XOR-scrambled, not as plain text (Keychain.unscramble).
          export HOURGLASS_TOKEN_X=$(python3 -c 'import os;s=b"dev.marobotic.hourglass";t=os.environ.get("HOURGLASS_TOKEN","").encode();print("".join("%02x"%(b^s[i%len(s)]) for i,b in enumerate(t)))')
          brew install xcodegen
          xcodegen generate

      # Unsigned: signing happens on Linux with a free Apple ID (see maro-ios).
      - name: Build
        run: |
          xcodebuild \
            -project Hourglass.xcodeproj \
            -scheme Hourglass \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || { grep -E "error:" build.log | sort -u; exit 1; }
          grep -E "Sources/.*warning:" build.log | sort -u || true

      - name: Package ipa
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Hourglass.app Payload/
          zip -qr Hourglass.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Hourglass-ipa
          path: ios/Hourglass.ipa

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: ios/build.log
