name: Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: cd server && npm ci
      - run: node --test 'core/test/*.test.js' 'server/test/*.test.js'
