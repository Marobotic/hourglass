name: Windows

on:
  workflow_dispatch:

jobs:
  package:
    runs-on: windows-latest
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # The window (0.3): Tauri 2 + the HTML/JS UI in desktop\.
      - name: Build the window
        shell: pwsh
        run: |
          Push-Location desktop
          npm ci --no-audit --no-fund
          node build.mjs
          if ($LASTEXITCODE -ne 0) { throw "desktop UI build failed" }
          cargo build --release --manifest-path src-tauri\Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "desktop cargo build failed" }
          Pop-Location

      # The package mirrors the repo, so the app finds its parts by the same
      # relative paths it uses in a checkout: windows\sidecar imports ..\..\core,
      # the window is windows\window\Hourglass.exe. No config.json and no token:
      # the server is built in, and everyone signs in.
      - name: Assemble package
        shell: pwsh
        run: |
          $d = "dist\Hourglass"
          $w = "$d\windows"
          New-Item -ItemType Directory -Force "$w\node", "$w\window" | Out-Null
          Copy-Item desktop\src-tauri\target\release\hourglass.exe "$w\window\Hourglass.exe"
          Push-Location server; npm ci --omit=dev --no-audit --no-fund; Pop-Location
          Copy-Item core "$d\core" -Recurse
          Copy-Item server "$d\server" -Recurse
          Copy-Item assets "$d\assets" -Recurse
          Remove-Item "$d\core\test", "$d\server\test" -Recurse -Force
          foreach ($x in "sidecar", "bin", "share", "tools") { Copy-Item "windows\$x" $w -Recurse -Force }
          # The Explorer sync helper (Cloud Files): without it every synced folder is skipped.
          cargo build --manifest-path windows\shell\hourglass-shell\Cargo.toml --release --locked
          if ($LASTEXITCODE -ne 0) { throw "hourglass-shell build failed" }
          Copy-Item windows\shell\hourglass-shell\target\release\hourglass-shell.exe "$w\bin"
          Copy-Item windows\Hourglass.ps1, windows\Hourglass.vbs, windows\Install.ps1, windows\hourglass.ico, windows\README.txt $w
          Copy-Item (Get-Command node).Source "$w\node\node.exe"
          # hourglassd.exe: a named copy of node, so Task Manager says Hourglass (the window already is).
          & "$w\tools\brand.ps1"
          if (-not (Test-Path "$w\window\Hourglass.exe") -or -not (Test-Path "$w\node\hourglassd.exe")) { throw "the package has no window or service" }
          if (-not (Test-Path "$w\bin\hourglass-shell.exe")) { throw "hourglass-shell.exe missing from the package" }
          "version=$(node -p "require('fs').readFileSync('server/app.js','utf8').match(/VERSION = \x22([^\x22]+)/)[1]")" >> $env:GITHUB_ENV

      # Start the service with a throwaway profile (no sync, no update check) and check
      # it lets the window's origin in, so a broken package fails here rather than on a PC.
      - name: Smoke test
        shell: pwsh
        run: |
          $w = "dist\Hourglass\windows"
          $env:HOURGLASS_CONFIG = "$env:RUNNER_TEMP\hg-conf"
          $env:HOURGLASS_DATA = "$env:RUNNER_TEMP\hg-data"
          $env:HOURGLASS_PORT = "8941"
          $env:HOURGLASS_SILENT = "1"
          $env:HOURGLASS_UPDATE_FEED = "off"
          $p = Start-Process -PassThru -NoNewWindow "$w\node\hourglassd.exe" "$w\sidecar\hourglassd.js"
          for ($i = 0; $i -lt 50; $i++) { try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8941/health | Out-Null; break } catch { Start-Sleep -Milliseconds 300 } }
          $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8941/api/app -Method Options -Headers @{ Origin = "http://tauri.localhost"; "Access-Control-Request-Method" = "GET"; "Access-Control-Request-Headers" = "authorization" }
          if ($r.Headers["Access-Control-Allow-Origin"] -ne "http://tauri.localhost") { throw "the service does not let the window in (CORS)" }
          Stop-Process -Id $p.Id

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DAppVersion=$env:version" "/DPackage=..\..\dist\Hourglass" windows\installer\Hourglass.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Get-ChildItem dist\*.exe

      # The installer goes on the latest-build release (prerelease) as
      # Hourglass-setup.exe: release assets do not count against the account's
      # Actions storage, which ran out. tools/release.ps1 takes it from there.
      - name: Publish to the latest-build release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest-build *> $null
          if ($LASTEXITCODE -ne 0) { gh release create latest-build --prerelease --title "Latest build" --notes "The newest builds from main, replaced on every push." }
          Copy-Item (Get-ChildItem dist\Hourglass-*-setup.exe | Select-Object -First 1).FullName Hourglass-setup.exe
          gh release upload latest-build Hourglass-setup.exe --clobber
          if ($LASTEXITCODE -ne 0) { throw "upload failed" }

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Hourglass-setup
          path: dist/Hourglass-*-setup.exe
          retention-days: 3

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Hourglass-windows
          path: dist/Hourglass
          retention-days: 3

