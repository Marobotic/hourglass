[package]
name = "hourglass-shell"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.62", features = [
  "Foundation",
  "Foundation_Collections",
  "Storage",
  "Storage_Provider",
  "Storage_Search",
  "Win32_Foundation",
  "Win32_Storage_CloudFilters",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Threading",
  "Win32_System_WinRT",
  "Win32_Security",
  "Win32_Security_Authorization",
] }
